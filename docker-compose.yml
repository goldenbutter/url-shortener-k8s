version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: urlshort-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshort-backend
    ports:
      - "8000:8000"
    environment:
      USE_REDIS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  redis-data: